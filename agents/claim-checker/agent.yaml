kind: agent
name: Claim Checker
summary: "Checks a forwarded message or rumour against Wikipedia and says, part by part, what holds up, with sources."
description: |
  Paste the message you received. Claim Checker splits it into the statements that can be
  checked, searches Wikipedia for each, and judges every statement against what the articles
  actually say: supported, contradicted, or can't tell. Every verdict quotes and links its source,
  and it points out common tricks, such as an old event shared as new. It works in any language
  that has a Wikipedia.
category: search
tags: [fact-checking, misinformation, media-literacy, wikipedia]
license: Apache-2.0
pricing:
  education:
    price: free
    usage: Unlimited for schools, orphanages, educators and students.
  individuals:
    price: free
    usage: Free for everyone.
  business:
    price: contact
    usage: Ask the maavaDao team.
agent:
  runtime: maava-gateway
  audience: "Anyone deciding whether to believe or forward a message, and teachers of media literacy"
  languages: [en]
  data_collected: The message is sent to your maava gateway to split and judge, and search terms are sent to Wikipedia. Nothing is kept after the session.
  entrypoint: src/main.py
maintainer:
  name: maavaDao team
  github: maavadao
