kind: agent
name: Dependency Doctor
summary: "Scans a project's lockfile for known vulnerabilities and tells you exactly what to upgrade first."
description: |
  Point it at package-lock.json, poetry.lock, Cargo.lock or a pinned requirements.txt. It checks
  every package against OSV.dev, the open vulnerability database, then gives you a ranked plan:
  which upgrades matter most, the exact version to move to, and the commands to run. It never
  sends your code anywhere, only package names and versions.
category: coding
tags: [security, dependencies, vulnerabilities, developers]
license: Apache-2.0
pricing:
  education:
    price: free
    usage: Unlimited for schools, orphanages, educators and students.
  individuals:
    price: free
    usage: Free for personal and open-source projects.
  business:
    price: contact
    usage: Ask the maavaDao team.
agent:
  runtime: maava-gateway
  audience: "Developers and small teams who have hundreds of dependencies and no security staff"
  languages: [en]
  data_collected: Package names and versions from your lockfile are sent to OSV.dev to look them up. Nothing else leaves your machine, and nothing is kept after the session.
  entrypoint: src/main.py
maintainer:
  name: maavaDao team
  github: maavadao
