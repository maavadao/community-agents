kind: agent
name: Content Review Agent
summary: "Checks a draft before it goes out: facts, tone, accessibility, age suitability and copyright, then prepares it for publishing."
description: |
  Reads a draft against its sources and a publishing checklist: facts match sources, no copied
  text, language suits the audience's age, headings and alt text for accessibility, and no private
  information. It returns a pass/fix list and, once fixed, a publish-ready version with title,
  description and tags.
category: documents
tags: [review, fact-checking, accessibility, publishing, content-creation]
license: Apache-2.0
pricing:
  education:
    price: free
    usage: Unlimited for schools, orphanages, educators and students.
  individuals:
    price: free
    usage: Free for personal use.
  business:
    price: contact
    usage: Ask the maavaDao team.
agent:
  runtime: maava-gateway
  audience: "Content creators and educators about to publish"
  languages: [en]
  data_collected: Content you provide is processed to answer you and is not kept after the session. No accounts or analytics.
  entrypoint: src/main.py
maintainer:
  name: maavaDao team
  github: maavadao
